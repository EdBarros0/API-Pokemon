services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manager_api
    restart: always
    ports:
      - "${PORT:-3333}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-development}
      USE_EXTERNAL_API: ${USE_EXTERNAL_API:-true}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-manager}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-manager_db}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manager_network

  postgres:
    image: postgres:16-alpine
    container_name: manager_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-manager_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manager} -d ${POSTGRES_DB:-manager_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - manager_network
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - manager_network

volumes:
  postgres_data:

networks:
  manager_network:
    driver: bridge
